<!DOCTYPE html>
<!--
    Mesai Kiosk Ekranı (kart okuyucu terminali)

    Tek dosyadır; tek bağımlılığı aynı klasördeki config.js dosyasıdır. İnternet/CDN gerektirmez,
    doğrudan dosyadan (file://) açılır. Sunucuya ulaşılamasa bile ekran açılır ve bağlantı gelince kendiliğinden toparlanır.
    Tüm görseller CSS, satır içi SVG ve <canvas> ile çizilir; harici yazı tipi, görsel veya ses dosyası yoktur.

    config.js içeriği (Admin Paneli > Kiosk Terminalleri ekranından hazır olarak indirilebilir):

        window.KIOSK_CONFIG = {
            apiUrl: "https://mesai.sirket.com",
            terminalKey: "tk_..."
        };

    Not: Tarayıcılar file:// sayfalarında "export/import" modüllerini engeller; bu yüzden config.js global değişken atar.

    Kart okuyucu: klavye gibi çalışan (USB HID) okuyucular kart UID'sini yazıp Enter (veya Tab) gönderir.
    Sayfa tuş vuruşlarını her yerden dinler; odaklanması gereken bir giriş kutusu yoktur.

    Önerilen tarayıcı başlatma: chrome.exe --kiosk --autoplay-policy=no-user-gesture-required --user-data-dir=C:\kiosk-profile "file:///C:/kiosk/kiosk.html"
-->
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesai Kiosk</title>
    <style>
        :root {
            --bg: #070B14;
            --text: #F4F7FB;
            --muted: #93A1B5;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent: #5EE7DF;
            --accent-2: #B490FF;
            --green: #1FBF75;
            --green-2: #0E8F7E;
            --blue: #3B82F6;
            --blue-2: #6D4BE0;
            --amber: #F5A524;
            --amber-2: #E2582C;
            --red: #EF4444;
            --red-2: #9F1239;
            --font: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            overflow: hidden;
            user-select: none;
            cursor: none;
            -webkit-font-smoothing: antialiased;
        }

        .hidden { display: none !important; }

        /* ============================================================
           ARKA PLAN: aurora + parçacık takımyıldızı
           ============================================================ */
        .aurora {
            position: fixed;
            inset: -20%;
            filter: blur(90px) saturate(140%);
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
        }

        .aurora span {
            position: absolute;
            width: 55vmax;
            height: 55vmax;
            border-radius: 50%;
            mix-blend-mode: screen;
            transition: background 1.2s ease;
        }

        .aurora span:nth-child(1) { background: radial-gradient(circle, #1E6FFF 0%, transparent 65%); top: 0; left: 0; animation: drift1 26s ease-in-out infinite alternate; }
        .aurora span:nth-child(2) { background: radial-gradient(circle, #7C3AED 0%, transparent 65%); bottom: 0; right: 0; animation: drift2 31s ease-in-out infinite alternate; }
        .aurora span:nth-child(3) { background: radial-gradient(circle, #06B6D4 0%, transparent 65%); top: 30%; left: 35%; animation: drift3 22s ease-in-out infinite alternate; }

        @keyframes drift1 { to { transform: translate(40vw, 25vh) scale(1.25); } }
        @keyframes drift2 { to { transform: translate(-35vw, -30vh) scale(1.15); } }
        @keyframes drift3 { to { transform: translate(-25vw, 20vh) scale(0.85); } }

        #bgCanvas, #fxCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #bgCanvas { z-index: 1; }
        #fxCanvas { z-index: 50; }

        .screen {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        /* ============================================================
           BEKLEME EKRANI
           ============================================================ */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3.2vh 3.5vw 0;
        }

        .terminal-label {
            display: flex;
            align-items: center;
            gap: 1.2vw;
        }

        /* Logo görselinin kendi kenar boşlukları var; negatif boşlukla saate yaklaştırılır */
        .brand-logo {
            height: clamp(100px, min(15vw, 21vh), 280px);
            width: auto;
            margin: calc(-1 * min(2.5vw, 3.5vh)) 0 calc(-1 * min(2vw, 3vh));
            transform: translateY(-30%);  /* Yalnızca logoyu yukarı taşır; saat ve altındakiler yerinde kalır */
            filter: drop-shadow(0 6px 30px rgba(94, 231, 223, 0.35));
            -webkit-user-drag: none;
        }

        .terminal-label strong { display: block; font-size: clamp(30px, 2.8vw, 48px); font-weight: 700; letter-spacing: 0.3px; }
        .terminal-label span { display: block; color: var(--muted); font-size: clamp(22px, 1.9vw, 32px); margin-top: 2px; }

        .conn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 26px;
            border-radius: 999px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            font-size: clamp(22px, 1.8vw, 30px);
            font-weight: 600;
            color: var(--muted);
            transition: all 0.4s ease;
        }

        .conn-dot {
            position: relative;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--muted);
        }

        .conn-dot::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: inherit;
            animation: dotPing 2s ease-out infinite;
        }

        @keyframes dotPing { to { transform: scale(3); opacity: 0; } }

        .conn.online { color: #B6F5D6; border-color: rgba(31, 191, 117, 0.45); }
        .conn.online .conn-dot { background: var(--green); }
        .conn.offline { color: #FFC2C2; border-color: rgba(239, 68, 68, 0.55); background: rgba(239, 68, 68, 0.12); }
        .conn.offline .conn-dot { background: var(--red); }

        .idle {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .clock {
            display: flex;
            align-items: baseline;
            font-size: clamp(110px, min(20vw, 30vh), 330px);
            font-weight: 200;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
            text-shadow: 0 0 60px rgba(94, 231, 223, 0.25);
            margin-top: 0.5vh;
        }

        .clock .digit {
            display: inline-block;
            min-width: 0.6em;
            text-align: center;
        }

        .clock .digit.tick { animation: digitIn 0.55s cubic-bezier(0.2, 1.4, 0.4, 1); }

        @keyframes digitIn {
            from { transform: translateY(-38%) rotateX(70deg); opacity: 0; filter: blur(6px); }
            to { transform: none; opacity: 1; filter: none; }
        }

        .clock .colon { animation: colonBlink 1s steps(1) infinite; padding: 0 0.04em; opacity: 0.85; }
        .clock .seconds { font-size: 0.42em; color: var(--muted); margin-left: 0.15em; display: inline-flex; }

        @keyframes colonBlink { 50% { opacity: 0.25; } }

        .date {
            font-size: clamp(26px, min(3.2vw, 4.6vh), 56px);
            color: var(--muted);
            font-weight: 400;
            margin-top: 0.8vh;
            text-transform: capitalize;
        }

        /* Kart hedefi */
        .card-zone {
            margin-top: 4.5vh;
            display: flex;
            align-items: center;
            gap: 3vw;
        }

        .target {
            position: relative;
            width: clamp(130px, min(15vw, 22vh), 270px);
            height: clamp(130px, min(15vw, 22vh), 270px);
            display: grid;
            place-items: center;
        }

        .target .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid var(--accent);
            opacity: 0;
            animation: ringOut 3s cubic-bezier(0.2, 0.6, 0.3, 1) infinite;
        }

        .target .ring:nth-child(2) { animation-delay: 1s; border-color: var(--accent-2); }
        .target .ring:nth-child(3) { animation-delay: 2s; }

        @keyframes ringOut {
            0% { transform: scale(0.45); opacity: 0.9; }
            100% { transform: scale(1.35); opacity: 0; }
        }

        .target .core {
            position: absolute;
            inset: 18%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(94, 231, 223, 0.35), rgba(124, 58, 237, 0.18) 60%, transparent 75%);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 0 40px rgba(94, 231, 223, 0.25), 0 0 60px rgba(124, 58, 237, 0.25);
        }

        .target .card {
            position: relative;
            width: 64%;
            animation: cardFloat 3.2s ease-in-out infinite;
            filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.45));
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(6%) rotate(-8deg); }
            50% { transform: translateY(-8%) rotate(4deg); }
        }

        .prompt-text { text-align: left; }

        .prompt-title {
            font-size: clamp(44px, min(5.6vw, 8.5vh), 100px);
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1.05;
        }

        .prompt-title .wave-letter {
            display: inline-block;
            animation: letterWave 3.5s ease-in-out infinite;
        }

        @keyframes letterWave {
            0%, 60%, 100% { transform: none; color: var(--text); }
            30% { transform: translateY(-14%); color: var(--accent); }
        }

        .offline-note {
            margin-top: 3vh;
            padding: 18px 34px;
            border-radius: 18px;
            background: rgba(239, 68, 68, 0.14);
            border: 1px solid rgba(239, 68, 68, 0.45);
            font-size: clamp(26px, 2.2vw, 38px);
            color: #FFC9C9;
            animation: notePulse 2.4s ease-in-out infinite;
        }

        @keyframes notePulse { 50% { box-shadow: 0 0 40px rgba(239, 68, 68, 0.35); } }

        .footer {
            padding: 0 3.5vw 2.4vh;
            display: flex;
            justify-content: flex-end;
            font-size: 18px;
            color: rgba(147, 161, 181, 0.45);
        }

        /* ============================================================
           OKUNUYOR (işlem sürerken)
           ============================================================ */
        .busy {
            align-items: center;
            justify-content: center;
            gap: 4vh;
            background: rgba(7, 11, 20, 0.72);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.15s ease;
        }

        .orbit {
            position: relative;
            width: clamp(170px, 14vw, 240px);
            height: clamp(170px, 14vw, 240px);
        }

        .orbit span {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 6px solid transparent;
            border-top-color: var(--accent);
            animation: spin 1s linear infinite;
        }

        .orbit span:nth-child(2) { inset: 14%; border-top-color: var(--accent-2); animation-duration: 0.75s; animation-direction: reverse; }
        .orbit span:nth-child(3) { inset: 28%; border-top-color: #fff; animation-duration: 0.55s; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } }

        .busy-text { font-size: clamp(48px, 4.6vw, 80px); font-weight: 700; letter-spacing: 1px; }

        /* ============================================================
           SONUÇ EKRANI
           ============================================================ */
        .result {
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4vh 5vw;
            overflow: hidden;
        }

        /* Merkezden dışa doğru açılan renk patlaması */
        .result-burst {
            position: absolute;
            inset: 0;
            z-index: -1;
            animation: burst 0.7s cubic-bezier(0.65, 0, 0.35, 1) both;
        }

        @keyframes burst {
            from { clip-path: circle(0% at 50% 50%); }
            to { clip-path: circle(150% at 50% 50%); }
        }

        .result-burst::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 120%, rgba(255, 255, 255, 0.22), transparent 55%),
                repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.05) 0 2px, transparent 2px 60px);
            animation: sheen 8s linear infinite;
        }

        @keyframes sheen { to { background-position: 0 0, 600px 0; } }

        .result.CHECK_IN .result-burst { background: linear-gradient(135deg, var(--green), var(--green-2)); }
        .result.CHECK_OUT .result-burst { background: linear-gradient(135deg, var(--blue), var(--blue-2)); }
        .result.TOO_SOON .result-burst { background: linear-gradient(135deg, var(--amber), var(--amber-2)); }
        .result.UNKNOWN_CARD .result-burst,
        .result.ERROR .result-burst { background: linear-gradient(135deg, var(--red), var(--red-2)); }

        .result.UNKNOWN_CARD .result-content,
        .result.ERROR .result-content { animation: shake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) 0.35s both; }

        @keyframes shake {
            10%, 90% { transform: translateX(-6px); }
            20%, 80% { transform: translateX(12px); }
            30%, 50%, 70% { transform: translateX(-22px); }
            40%, 60% { transform: translateX(22px); }
        }

        .result-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2vh;
        }

        .result-icon {
            width: clamp(170px, 14vw, 250px);
            height: clamp(170px, 14vw, 250px);
            animation: iconPop 0.7s cubic-bezier(0.2, 1.6, 0.4, 1) 0.25s both;
        }

        @keyframes iconPop { from { transform: scale(0) rotate(-30deg); opacity: 0; } }

        .result-icon .icon-bg { fill: rgba(255, 255, 255, 0.18); stroke: rgba(255, 255, 255, 0.55); stroke-width: 3; }

        .result-icon .draw {
            fill: none;
            stroke: #fff;
            stroke-width: 9;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 260;
            stroke-dashoffset: 260;
            animation: draw 0.6s ease-out 0.6s forwards;
        }

        .result-icon .draw.second { animation-delay: 0.85s; }

        @keyframes draw { to { stroke-dashoffset: 0; } }

        .result-icon .hourglass { transform-origin: 50% 50%; animation: flip 2s ease-in-out 0.6s infinite; }

        @keyframes flip { 0%, 40% { transform: rotate(0); } 60%, 100% { transform: rotate(180deg); } }

        .result-title {
            font-size: clamp(96px, 11vw, 190px);
            font-weight: 900;
            letter-spacing: 4px;
            line-height: 1;
            text-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
            animation: titleIn 0.6s cubic-bezier(0.2, 1.2, 0.4, 1) 0.35s both;
        }

        @keyframes titleIn { from { transform: translateY(40px) scale(0.9); opacity: 0; letter-spacing: 30px; } }

        .result-name {
            font-size: clamp(64px, 6.6vw, 118px);
            font-weight: 700;
            line-height: 1.1;
        }

        .result-name .ch {
            display: inline-block;
            white-space: pre;
            animation: charIn 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both;
        }

        @keyframes charIn { from { transform: translateY(60%) rotate(8deg); opacity: 0; } }

        .result-time {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 10px 30px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.18);
            font-size: clamp(40px, 3.8vw, 66px);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            animation: fadeUp 0.5s ease 0.9s both;
        }

        .result-message {
            font-size: clamp(36px, 3.4vw, 58px);
            max-width: 85vw;
            line-height: 1.3;
            opacity: 0.95;
            animation: fadeUp 0.5s ease 1s both;
        }

        @keyframes fadeUp { from { transform: translateY(24px); opacity: 0; } }

        .result-warning {
            margin-top: 1vh;
            padding: 20px 40px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.28);
            border: 2px solid rgba(255, 255, 255, 0.35);
            font-size: clamp(32px, 2.9vw, 50px);
            font-weight: 700;
            animation: fadeUp 0.5s ease 1.1s both, warnGlow 1.4s ease-in-out 1.6s infinite;
        }

        @keyframes warnGlow { 50% { box-shadow: 0 0 50px rgba(255, 220, 120, 0.55); } }

        /* Canlı geri sayım halkası (TOO_SOON) */
        .countdown {
            position: relative;
            width: clamp(150px, 12vw, 210px);
            height: clamp(150px, 12vw, 210px);
            animation: fadeUp 0.5s ease 1.05s both;
        }

        .countdown svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .countdown circle { fill: none; stroke-width: 10; }
        .countdown .track { stroke: rgba(255, 255, 255, 0.2); }
        .countdown .bar { stroke: #fff; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }

        .countdown-num {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: clamp(56px, 4.8vw, 84px);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        /* Ekranın ne zaman kapanacağını gösteren alt çubuk */
        .drain {
            position: absolute;
            left: 0;
            bottom: 0;
            height: 12px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            transform-origin: left center;
        }

        .drain.run { animation: drain linear forwards; }

        @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

        /* ============================================================
           KURULUM HATASI / YETKİSİZ TERMİNAL
           ============================================================ */
        .fatal {
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 3vh;
            padding: 5vh 6vw;
            background: radial-gradient(circle at 50% 30%, rgba(159, 18, 57, 0.55), rgba(7, 11, 20, 0.95) 70%);
        }

        .fatal-icon { width: clamp(130px, 10vw, 180px); animation: fatalPulse 2.4s ease-in-out infinite; }

        @keyframes fatalPulse { 50% { transform: scale(1.08); filter: drop-shadow(0 0 30px rgba(239, 68, 68, 0.7)); } }

        .fatal h1 { font-size: clamp(64px, 6.4vw, 110px); font-weight: 800; color: #FFD0D0; }
        .fatal p { font-size: clamp(30px, 2.6vw, 44px); color: #F1DCDC; max-width: 85vw; line-height: 1.45; }

        .fatal pre {
            padding: 26px 34px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            font-family: Consolas, "Courier New", monospace;
            font-size: clamp(22px, 1.8vw, 30px);
            text-align: left;
            color: var(--text);
            user-select: text;
        }

        /* Hareket azaltma tercihi olan sistemlerde ağır animasyonları kapat */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
            .aurora { display: none; }
        }
    </style>
</head>
<body>

    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
    <canvas id="bgCanvas" aria-hidden="true"></canvas>

    <!-- Bekleme ekranı -->
    <div id="idleScreen" class="screen hidden">
        <div class="topbar">
            <div class="terminal-label">
                <div>
                    <strong id="terminalName">Mesai Kiosku</strong>
                    <span id="terminalLocation">Bağlanılıyor...</span>
                </div>
            </div>
            <div id="connStatus" class="conn">
                <div class="conn-dot"></div>
                <span id="connText">Bağlanılıyor...</span>
            </div>
        </div>

        const ERROR_DISPLAY_MS = 6500;       // Uyarı / hata sonucunun ekranda kalma süresi
        const KEY_GAP_RESET_MS = 1000;       // Bu süreden uzun aralıklı tuşlar yeni okuma sayılır (yarım okumaları atar)
        const MAX_UID_LENGTH = 100;
        const REDUCED_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        const CONFIG_TEMPLATE =
            'window.KIOSK_CONFIG = {\n' +
            '    apiUrl: "https://mesai.sirket.com",\n' +
            '    terminalKey: "tk_..."\n' +
            '};';

        const $ = (id) => document.getElementById(id);

        const config = window.KIOSK_CONFIG || {};
        const apiUrl = String(config.apiUrl || "").trim().replace(/\/+$/, "");
        const terminalKey = String(config.terminalKey || "").trim();

        let isBusy = false;
        let isUnauthorized = false;
        let resultTimer = null;
        let countdownTimer = null;

        // ------------------------------------------------------------
        // Ekranlar
        // ------------------------------------------------------------

        const SCREENS = ["idleScreen", "busyScreen", "resultScreen", "fatalScreen"];

        function showScreen(id) {
            SCREENS.forEach((screenId) => $(screenId).classList.toggle("hidden", screenId !== id));
        }

        function showFatal(title, message, detail) {
            $("fatalTitle").textContent = title;
            $("fatalMessage").textContent = message;
            $("fatalDetail").textContent = detail || "";
            $("fatalDetail").classList.toggle("hidden", !detail);
            showScreen("fatalScreen");
        }

        function showUnauthorized() {
            showFatal(
                "Terminal Yetkisiz",
                "Bu kioskun anahtarı geçersiz veya terminal devre dışı bırakılmış. Lütfen yöneticinize başvurunuz. " +
                "Terminal yeniden etkinleştirildiğinde ekran kendiliğinden açılır; anahtar yenilendiyse config.js güncellenmelidir."
            );
        }

        function returnToIdle() {
            clearTimeout(resultTimer);
            clearInterval(countdownTimer);
            if (isUnauthorized) {
                showUnauthorized();
            } else {
                showScreen("idleScreen");
            }
        }

        function setConnection(state) {
            const conn = $("connStatus");
            conn.classList.toggle("online", state === "online");
            conn.classList.toggle("offline", state === "offline");
            $("connText").textContent = state === "online" ? "Bağlı" : state === "offline" ? "Bağlantı yok" : "Bağlanılıyor...";
            $("offlineNote").classList.toggle("hidden", state !== "offline");
        }

        // ------------------------------------------------------------
        // Sonuç ekranı ve ikonlar
        // ------------------------------------------------------------

        const ICONS = {
            check:
                '<svg class="result-icon" viewBox="0 0 100 100"><circle class="icon-bg" cx="50" cy="50" r="46"/>' +
                '<path class="draw" d="M28 52 L44 67 L73 35"/></svg>',
            exit:
                '<svg class="result-icon" viewBox="0 0 100 100"><circle class="icon-bg" cx="50" cy="50" r="46"/>' +
                '<path class="draw" d="M44 30 H30 V70 H44"/><path class="draw second" d="M46 50 H74 M62 37 L75 50 L62 63"/></svg>',
            hourglass:
                '<svg class="result-icon" viewBox="0 0 100 100"><circle class="icon-bg" cx="50" cy="50" r="46"/>' +
                '<g class="hourglass"><path class="draw" d="M33 26 H67 M33 74 H67 M37 26 C37 42 63 46 63 50 C63 54 37 58 37 74 M63 26 C63 42 37 46 37 50 C37 54 63 58 63 74"/></g></svg>',
            cross:
                '<svg class="result-icon" viewBox="0 0 100 100"><circle class="icon-bg" cx="50" cy="50" r="46"/>' +
                '<path class="draw" d="M33 33 L67 67"/><path class="draw second" d="M67 33 L33 67"/></svg>'
        };

        function restartAnimations(element) {
            // Aynı sonuç art arda gelirse animasyonların baştan oynaması için öğeyi yeniden oluştur
            const clone = element.cloneNode(true);
            element.replaceWith(clone);
            return clone;
        }

        function renderName(name) {
            const target = $("resultName");
            target.innerHTML = "";
            Array.from(name || "").forEach((ch, i) => {
                const span = document.createElement("span");
                span.className = "ch";
                span.textContent = ch;
                span.style.animationDelay = (0.55 + i * 0.035) + "s";
                target.appendChild(span);
            });
        }

        function showResult(opts) {
            clearTimeout(resultTimer);
            clearInterval(countdownTimer);
            clearEffects();

            const screen = restartAnimations($("resultScreen"));
            screen.className = "screen result " + opts.kind;

            $("resultIcon").innerHTML = ICONS[opts.icon] || "";
            $("resultTitle").textContent = opts.title;
            renderName(opts.name);

            $("resultTime").textContent = opts.time || "";
            $("resultTime").classList.toggle("hidden", !opts.time);
            $("resultMessage").textContent = opts.message || "";
            $("resultWarning").textContent = opts.warning || "";
            $("resultWarning").classList.toggle("hidden", !opts.warning);

            $("resultCountdown").classList.toggle("hidden", !opts.countdown);
            if (opts.countdown) startCountdown(opts.countdown);

            const drain = $("resultDrain");
            drain.classList.add("run");
            drain.style.animationDuration = opts.durationMs + "ms";

            showScreen("resultScreen");
            resultTimer = setTimeout(returnToIdle, opts.durationMs);
        }

        function startCountdown(seconds) {
            const bar = $("countdownBar");
            const circumference = 2 * Math.PI * 52;
            const total = Math.max(1, seconds);
            let remaining = total;

            bar.style.strokeDasharray = circumference;
            const render = () => {
                $("countdownNum").textContent = remaining;
                bar.style.strokeDashoffset = circumference * (1 - remaining / total);
            };
            render();

            countdownTimer = setInterval(() => {
                remaining = Math.max(0, remaining - 1);
                render();
                if (remaining === 0) clearInterval(countdownTimer);
            }, 1000);
        }

        // ------------------------------------------------------------
        // Saat ve selamlama
        // ------------------------------------------------------------

        let lastClockText = "";

        function greetingFor(hour) {
            if (hour >= 5 && hour < 11) return "Günaydın";
            if (hour >= 11 && hour < 17) return "İyi günler";
            if (hour >= 17 && hour < 22) return "İyi akşamlar";
            return "İyi geceler";
        }

        function updateClock() {
            const now = new Date();
            const pad = (n) => String(n).padStart(2, "0");
            const text = pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());

            const clock = $("clock");
            if (!clock.children.length) {
                // Yapı: HH : MM [SS]
                clock.innerHTML =
                    '<span class="digit"></span><span class="digit"></span><span class="colon">:</span>' +
                    '<span class="digit"></span><span class="digit"></span>' +
                    '<span class="seconds"><span class="digit"></span><span class="digit"></span></span>';
            }

            const digits = clock.querySelectorAll(".digit");
            for (let i = 0; i < 6; i++) {
                if (text[i] !== lastClockText[i]) {
                    const d = digits[i];
                    d.textContent = text[i];
                    d.classList.remove("tick");
                    void d.offsetWidth; // animasyonu yeniden tetikle
                    if (lastClockText) d.classList.add("tick");
                }
            }
            lastClockText = text;

            $("date").textContent = now.toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        }

        function formatTime(date) {
            return date.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
        }

        function waveifyPrompt() {
            const el = $("promptTitle");
            const text = el.textContent;
            el.innerHTML = "";
            Array.from(text).forEach((ch, i) => {
                const span = document.createElement("span");
                span.className = "wave-letter";
                span.textContent = ch === " " ? "\u00A0" : ch;
                span.style.animationDelay = (i * 0.06) + "s";
                el.appendChild(span);
            });
        }

        // ------------------------------------------------------------
        // Arka plan: parçacık takımyıldızı (canvas)
        // ------------------------------------------------------------

        const bg = { canvas: null, ctx: null, particles: [], tint: [94, 231, 223], targetTint: [94, 231, 223], w: 0, h: 0, dpr: 1 };

        function resizeCanvases() {
            bg.dpr = Math.min(window.devicePixelRatio || 1, 2);
            bg.w = window.innerWidth;
            bg.h = window.innerHeight;
            [bg.canvas, fx.canvas].forEach((c) => {
                c.width = bg.w * bg.dpr;
                c.height = bg.h * bg.dpr;
            });
            bg.ctx.setTransform(bg.dpr, 0, 0, bg.dpr, 0, 0);
            fx.ctx.setTransform(bg.dpr, 0, 0, bg.dpr, 0, 0);
        }

        function initBackground() {
            bg.canvas = $("bgCanvas");
            bg.ctx = bg.canvas.getContext("2d");
            const count = Math.round(Math.min(90, (window.innerWidth * window.innerHeight) / 22000));
            for (let i = 0; i < count; i++) {
                bg.particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    vx: (Math.random() - 0.5) * 0.35,
                    vy: (Math.random() - 0.5) * 0.35,
                    r: 1 + Math.random() * 2.2
                });
            }
        }

        function setBackgroundTint(rgb) {
            bg.targetTint = rgb;
        }

        function drawBackground() {
            const { ctx, particles, w, h } = bg;
            ctx.clearRect(0, 0, w, h);

            // Renk geçişi (sonuç rengine yumuşak geçiş)
            for (let i = 0; i < 3; i++) bg.tint[i] += (bg.targetTint[i] - bg.tint[i]) * 0.04;
            const [r, g, b] = bg.tint.map(Math.round);

            const linkDist = 150;
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < -20) p.x = w + 20; else if (p.x > w + 20) p.x = -20;
                if (p.y < -20) p.y = h + 20; else if (p.y > h + 20) p.y = -20;

                for (let j = i + 1; j < particles.length; j++) {
                    const q = particles[j];
                    const dx = p.x - q.x, dy = p.y - q.y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < linkDist * linkDist) {
                        ctx.strokeStyle = `rgba(${r},${g},${b},${0.18 * (1 - Math.sqrt(d2) / linkDist)})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(q.x, q.y);
                        ctx.stroke();
                    }
                }

                ctx.fillStyle = `rgba(${r},${g},${b},0.7)`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ------------------------------------------------------------
        // Efektler: konfeti ve dalga halkaları (canvas)
        // ------------------------------------------------------------

        const fx = { canvas: null, ctx: null, confetti: [], shockwaves: [] };

        function initEffects() {
            fx.canvas = $("fxCanvas");
            fx.ctx = fx.canvas.getContext("2d");
        }

        function burstConfetti(colors, count) {
            if (REDUCED_MOTION) return;
            const cx = bg.w / 2, cy = bg.h * 0.42;
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 6 + Math.random() * 14;
                fx.confetti.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 6,
                    w: 8 + Math.random() * 10,
                    h: 5 + Math.random() * 8,
                    rot: Math.random() * Math.PI,
                    vr: (Math.random() - 0.5) * 0.4,
                    color: colors[i % colors.length],
                    life: 1
                });
            }
        }

        function clearEffects() {
            fx.confetti = [];
            fx.shockwaves = [];
        }

        function shockwave(rgb) {
            if (REDUCED_MOTION) return;
            fx.shockwaves.push({ r: 0, rgb, alpha: 0.6 });
            fx.shockwaves.push({ r: -120, rgb, alpha: 0.45 });
        }

        function drawEffects() {
            const { ctx } = fx;
            ctx.clearRect(0, 0, bg.w, bg.h);

            fx.shockwaves = fx.shockwaves.filter((s) => s.alpha > 0.01);
            fx.shockwaves.forEach((s) => {
                s.r += 28;
                if (s.r <= 0) return;
                s.alpha *= 0.94;
                ctx.strokeStyle = `rgba(${s.rgb[0]},${s.rgb[1]},${s.rgb[2]},${s.alpha})`;
                ctx.lineWidth = 10;
                ctx.beginPath();
                ctx.arc(bg.w / 2, bg.h / 2, s.r, 0, Math.PI * 2);
                ctx.stroke();
            });

            fx.confetti = fx.confetti.filter((c) => c.life > 0 && c.y < bg.h + 40);
            fx.confetti.forEach((c) => {
                c.vy += 0.35;          // yerçekimi
                c.vx *= 0.985;         // hava direnci
                c.x += c.vx;
                c.y += c.vy;
                c.rot += c.vr;
                c.life -= 0.006;
                ctx.save();
                ctx.globalAlpha = Math.max(0, Math.min(1, c.life * 1.5));
                ctx.translate(c.x, c.y);
                ctx.rotate(c.rot);
                ctx.scale(1, Math.abs(Math.cos(c.rot * 2)) * 0.8 + 0.2); // dönerken ince görünme
                ctx.fillStyle = c.color;
                ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
                ctx.restore();
            });
        }

        function animationLoop() {
            if (!document.hidden) {
                if (!REDUCED_MOTION) drawBackground();
                drawEffects();
            }
            requestAnimationFrame(animationLoop);
        }

        // ------------------------------------------------------------
        // Sesli geri bildirim (ek dosya gerektirmez)
        // ------------------------------------------------------------

        let audioCtx = null;

        function beep(pattern) {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                let at = audioCtx.currentTime;
                pattern.forEach(([freq, ms, type]) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type || "sine";
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.0001, at);
                    gain.gain.exponentialRampToValueAtTime(0.25, at + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, at + ms / 1000);
                    osc.connect(gain).connect(audioCtx.destination);
                    osc.start(at);
                    osc.stop(at + ms / 1000);
                    at += ms / 1000 * 0.7;
                });
            } catch (e) {
                // Ses desteklenmiyorsa sessizce devam et
            }
        }

        const SOUND_IN = [[1047, 140], [1319, 140], [1568, 260]];          // yükselen do-mi-sol
        const SOUND_OUT = [[1568, 140], [1319, 140], [1047, 260]];         // alçalan sol-mi-do
        const SOUND_WARN = [[784, 180, "triangle"], [784, 220, "triangle"]];
        const SOUND_ERROR = [[220, 450, "sawtooth"]];

        // ------------------------------------------------------------
        // Sunucu iletişimi
        // ------------------------------------------------------------

        async function apiRequest(path, options) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
            try {
                return await fetch(apiUrl + path, {
                    ...options,
                    headers: { ...(options && options.headers), "Authorization": "Bearer " + terminalKey },
                    signal: controller.signal,
                    cache: "no-store"
                });
            } finally {
                clearTimeout(timer);
            }
        }

        async function ping() {
            try {
                const response = await apiRequest("/api/v1/kiosk/ping", { method: "GET" });

                if (response.status === 401) {
                    isUnauthorized = true;
                    setConnection("online");
                    if (!isBusy) showUnauthorized();
                    return;
                }
                if (!response.ok) throw new Error("HTTP " + response.status);

                const data = await response.json();
                $("terminalName").textContent = data.terminal_name;
                $("terminalLocation").textContent = data.location || data.terminal_code;
                setConnection("online");

                if (isUnauthorized) {
                    isUnauthorized = false;
                    if (!isBusy) returnToIdle();
                }
            } catch (e) {
                setConnection("offline");
            }
        }

        async function punch(cardUid) {
            if (isBusy || isUnauthorized) return;
            isBusy = true;
            clearTimeout(resultTimer);
            clearInterval(countdownTimer);
            showScreen("busyScreen");

            try {
                const response = await apiRequest("/api/v1/kiosk/punch", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ CardUID: cardUid })
                });

                if (response.status === 401) {
                    isUnauthorized = true;
                    beep(SOUND_ERROR);
                    showUnauthorized();
                    return;
                }

                if (!response.ok) {
                    setConnection("online");
                    showError("SUNUCU HATASI", "Okutma kaydedilemedi. Lütfen tekrar deneyiniz; sorun sürerse yöneticinize bildiriniz.");
                    return;
                }

                setConnection("online");
                showPunchResult(await response.json());
            } catch (e) {
                setConnection("offline");
                showError("BAĞLANTI HATASI", "Sunucuya ulaşılamadı; okutma kaydedilmedi. Lütfen tekrar deneyiniz.");
            } finally {
                isBusy = false;
            }
        }

        function showError(title, message) {
            beep(SOUND_ERROR);
            setBackgroundTint([239, 68, 68]);
            showResult({ kind: "ERROR", icon: "cross", title, message, durationMs: ERROR_DISPLAY_MS });
            shockwave([255, 120, 120]);
            setTimeout(() => setBackgroundTint([94, 231, 223]), ERROR_DISPLAY_MS);
        }

        function showPunchResult(data) {
            const time = data.action_time ? formatTime(new Date(data.action_time)) : "";
            const hour = new Date().getHours();
            let tint = [94, 231, 223];
            let durationMs = RESULT_DISPLAY_MS;

            switch (data.result) {
                case "CHECK_IN": {
                    const warning = data.warning === "MISSING_CHECKOUT"
                        ? "Önceki girişinizin çıkışı yapılmamış. Lütfen yöneticinize bildiriniz."
                        : "";
                    if (warning) durationMs = ERROR_DISPLAY_MS;
                    tint = [31, 191, 117];
                    beep(warning ? SOUND_WARN : SOUND_IN);
                    showResult({
                        kind: "CHECK_IN", icon: "check", title: "GİRİŞ",
                        name: data.employee_name, time: "Giriş saati " + time,
                        message: greetingFor(hour) + ", iyi çalışmalar!", warning, durationMs
                    });
                    shockwave([180, 255, 210]);
                    burstConfetti(["#FFFFFF", "#B6F5D6", "#5EE7DF", "#F7D774", "#1FBF75"], 160);
                    break;
                }
                case "CHECK_OUT":
                    tint = [96, 140, 255];
                    beep(SOUND_OUT);
                    showResult({
                        kind: "CHECK_OUT", icon: "exit", title: "ÇIKIŞ",
                        name: data.employee_name, time: "Çıkış saati " + time,
                        message: "Emeğinize sağlık, görüşmek üzere!", durationMs
                    });
                    shockwave([190, 205, 255]);
                    burstConfetti(["#FFFFFF", "#C7D2FE", "#B490FF", "#5EE7DF", "#3B82F6"], 160);
                    break;
                case "TOO_SOON": {
                    const already = data.last_action === "CHECK_OUT" ? "Çıkışınız" : "Girişiniz";
                    durationMs = ERROR_DISPLAY_MS;
                    tint = [245, 165, 36];
                    beep(SOUND_WARN);
                    showResult({
                        kind: "TOO_SOON", title: "BEKLEYİNİZ",
                        name: data.employee_name,
                        message: already + " zaten kaydedildi" + (time ? " (" + time + ")" : "") + ". Tekrar okutmak için:",
                        countdown: data.retry_after_seconds, durationMs
                    });
                    break;
                }
                case "UNKNOWN_CARD":
                    durationMs = ERROR_DISPLAY_MS;
                    tint = [239, 68, 68];
                    beep(SOUND_ERROR);
                    showResult({
                        kind: "UNKNOWN_CARD", icon: "cross", title: "KART TANINMADI",
                        message: "Bu kart kayıtlı değil. Lütfen yöneticinize başvurunuz.", durationMs
                    });
                    shockwave([255, 120, 120]);
                    break;
                default:
                    // Sunucu yeni bir sonuç türü eklerse hazır mesajı göster
                    durationMs = ERROR_DISPLAY_MS;
                    tint = [245, 165, 36];
                    beep(SOUND_WARN);
                    showResult({
                        kind: "TOO_SOON", icon: "hourglass", title: "BİLGİ",
                        name: data.employee_name, message: data.message, durationMs
                    });
            }

            setBackgroundTint(tint);
            setTimeout(() => setBackgroundTint([94, 231, 223]), durationMs);
        }

        // ------------------------------------------------------------
        // Kart okuyucu girişi (klavye gibi çalışan okuyucular)
        // ------------------------------------------------------------

        let cardBuffer = "";
        let lastKeyAt = 0;

        function onKeyDown(e) {
            const now = Date.now();
            if (now - lastKeyAt > KEY_GAP_RESET_MS) cardBuffer = "";
            lastKeyAt = now;

            if (e.key === "Enter" || e.key === "Tab") {
                e.preventDefault();
                const uid = cardBuffer.trim();
                cardBuffer = "";
                if (uid) punch(uid);
                return;
            }

            if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
                e.preventDefault();
                if (cardBuffer.length < MAX_UID_LENGTH) cardBuffer += e.key;
            }
        }

        // ------------------------------------------------------------
        // Başlangıç
        // ------------------------------------------------------------

        function start() {
            $("kioskVersion").textContent = KIOSK_VERSION;

            initBackground();
            initEffects();
            resizeCanvases();
            window.addEventListener("resize", resizeCanvases);
            requestAnimationFrame(animationLoop);

            if (!window.KIOSK_CONFIG) {
                showFatal(
                    "Yapılandırma Bulunamadı",
                    "config.js dosyası bulunamadı. kiosk.html ile aynı klasöre aşağıdaki içerikte config.js oluşturun " +
                    "(hazır dosya Admin Paneli > Kiosk Terminalleri ekranından indirilebilir):",
                    CONFIG_TEMPLATE
                );
                return;
            }
            if (!/^https?:\/\//i.test(apiUrl) || !terminalKey) {
                showFatal(
                    "Yapılandırma Eksik",
                    "config.js içinde apiUrl (https:// ile başlayan sunucu adresi) ve terminalKey dolu olmalıdır:",
                    CONFIG_TEMPLATE
                );
                return;
            }

            waveifyPrompt();
            updateClock();
            setInterval(updateClock, 1000);

            showScreen("idleScreen");
            window.addEventListener("keydown", onKeyDown);
            document.addEventListener("contextmenu", (e) => e.preventDefault());

            ping();
            setInterval(ping, PING_INTERVAL_MS);
        }

        start();
    </script>
</body>
</html>
